<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>git block harness</title>
<link rel="stylesheet" href="../../ui/tokens.css">
<link rel="stylesheet" href="../git.css">
<style>
  html, body { height: 100%; }
  body { background: var(--page); color: var(--t1); font: 13.5px var(--sans); }
  .stage { position: fixed; inset: 0; display: flex; gap: 6px; padding: 6px; background:
    radial-gradient(900px 500px at 10% -10%, var(--glow-a), transparent 60%), radial-gradient(700px 400px at 90% 110%, var(--glow-b), transparent 60%), var(--page); }
  .card { background: var(--panel); border-radius: 12px; box-shadow: 0 0 0 1px var(--l2); overflow: hidden; min-width: 0; min-height: 0; }
  #side { flex: 0 0 258px; display: flex; flex-direction: column; }
  #side header { flex: none; height: 40px; display: flex; align-items: center; padding: 0 14px; font-weight: 550; box-shadow: inset 0 -1px 0 var(--l1); }
  #changes { flex: 1; min-height: 0; }
  #block { flex: 1; }
  #toasts { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 99; align-items: center; }
  .toast { padding: 9px 14px; border-radius: 12px; background: var(--pop-bg); box-shadow: 0 0 0 1px var(--l2), 0 18px 40px -14px rgba(0,0,0,.5); font-size: 13px; }
  .toast.error { box-shadow: 0 0 0 1px color-mix(in srgb, var(--bad) 45%, transparent); }
</style>
</head>
<body>
<div class="stage">
  <div class="card" id="side"><header>pager</header><div id="changes"></div></div>
  <div class="card" id="block"></div>
</div>
<div id="toasts"></div>
<script type="module">
import git, { mountChanges } from '../git.js'

const q = new URLSearchParams(location.search)
document.documentElement.dataset.theme = q.get('theme') || 'dark'
const info = await (await fetch('/info')).json()
const cwd = q.get('cwd') || info.repo

const listeners = new Set()
const es = new EventSource('/events')
es.onmessage = (m) => { const { event, payload } = JSON.parse(m.data); for (const l of listeners) l(event, payload) }

async function rpc(method, args) {
  const r = await (await fetch('/rpc', { method: 'POST', body: JSON.stringify({ method, args }) })).json()
  if (!r.ok) throw new Error(r.error)
  return r.result
}
function toast(level, text) {
  const t = document.createElement('div')
  t.className = `toast ${level}`
  t.textContent = text
  document.getElementById('toasts').append(t)
  setTimeout(() => t.remove(), 3500)
}
const ctx = {
  rpc, cwd, toast,
  onEvent: (fn) => (listeners.add(fn), () => listeners.delete(fn)),
  setTitle: (t) => (document.title = t),
  openBlock: (name, args) => { console.log('openBlock', name, args); window.__opened = { name, args } },
  openPath: (p) => console.log('openPath', p),
}
window.__block = git.mount(document.getElementById('block'), { ...ctx, args: q.get('path') ? { cwd, path: q.get('path'), staged: q.get('staged') === '1' } : { cwd } })
window.__changes = mountChanges(document.getElementById('changes'), ctx)
window.__rpc = rpc
window.__info = info
</script>
</body>
</html>
