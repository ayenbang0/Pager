<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'">
<title>Pager</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar"><img src="pager.png" alt=""><span class="name">pager</span><button id="docs" type="button" title="Docs and usage stats (F1)">docs</button><button id="studio" type="button" title="Bot studio (F2)">bots</button><button id="web" type="button" title="Browser pane (Ctrl+Shift+B)">web</button></header>
<div id="work">
<main id="term"></main>
<div id="split" hidden></div>
<section id="pane" hidden>
<div id="tabs"></div>
<div id="nav"><button id="back" type="button" title="Back (Alt+Left)">‹</button><button id="fwd" type="button" title="Forward (Alt+Right)">›</button><button id="reload" type="button">⟳</button><input id="addr" type="text" placeholder="Search or enter address" spellcheck="false" autocomplete="off"><button id="hide" type="button" title="Hide the pane (Ctrl+Shift+B)">×</button></div>
<div id="note"></div>
<div id="viewport"></div>
</section>
</div>
<div id="glass"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script src="renderer.js"></script>
<script src="pane.js"></script>
</body>
</html>
