name: Release desktop
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run desktop:pack
      - name: Publish the zip and its checksum
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release/Pager-*-win-x64.zip release/Pager-*-win-x64.zip.sha256 --clobber || gh release create "$GITHUB_REF_NAME" release/Pager-*-win-x64.zip release/Pager-*-win-x64.zip.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
